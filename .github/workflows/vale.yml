name: Prose lint (Vale)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".vale.ini"
      - ".vale/**"
  pull_request:
    paths:
      - "docs/**"
      - ".vale.ini"
      - ".vale/**"

permissions:
  contents: read
  checks: write

jobs:
  vale:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vale-cli/vale-action@v3
        with:
          # Report-only: results appear on the Checks tab and never fail the build.
          reporter: github-check
          fail_on_error: false
          filter_mode: nofilter
          min_alert_level: warning
