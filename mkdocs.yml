site_name: Michael Scarborough | Technical Writing Portfolio
site_url: https://MackMike.github.io/technical-writing-portfolio-site/

theme:
  name: material
  logo: assets/pdfs/logo.svg
  favicon: images/favicon.png
  features:
    - content.code.copy

extra:
  analytics:
    provider: google
    property: G-2WST72633S

nav:
  - Home: index.md
  - About: about.md
  - Resume: resume.md
  - Projects:
      - Managed macOS Onboarding Guide: projects/managed-mac-onboarding.md
      - "KB Article: Troubleshooting Compliance Failures on Jamf-Managed Macs": projects/jamf-managed-mac-compliance-troubleshooting.md
      - "KB Article: Troubleshooting VPN Certificate Issues on Managed macOS Devices": projects/vpn-certificate-troubleshooting-project.md
      - Migrate User Administrative Tool Documentation: projects/migration-tool-project.md
      - "DITA Sample: Managed macOS Onboarding Guide": projects/dita-managed-mac-onboarding.md
      - Apache OpenOffice Technical Editing: projects/openoffice-technical-editing-project.md
      - Atari Computer User Guide: projects/atari-user-guide-project.md
      - Reading List API:
          - Project Overview: projects/reading-list-api-project.md
          - API Documentation: projects/reading-list-api/index.md
          - Quickstart: projects/reading-list-api/quickstart.md
          - Authentication: projects/reading-list-api/authentication.md
          - Error handling: projects/reading-list-api/errors.md
          - API reference: projects/reading-list-api/reference.md
          - Process and tooling: projects/reading-list-api/process.md
          - Changelog: projects/reading-list-api/changelog.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
