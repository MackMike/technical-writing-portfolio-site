# Vale configuration for the technical writing portfolio.
# Run locally:  vale sync   (once, to download the style guide)
#               vale docs/projects docs/index.md docs/about.md docs/resume.md

StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Portfolio

# Style guides downloaded by `vale sync`
Packages = Google

# Only files that match a section below are checked. Generated output
# (site/, the DITA out/ folder) and docs/assets/ are never linted.

[docs/*.md]
BasedOnStyles = Vale, Google

[docs/projects/*.md]
BasedOnStyles = Vale, Google

# Rules turned off on purpose. These pages are a first-person portfolio with
# title-case headings, so these Google rules mostly produce noise.
[*.md]
Google.Headings = NO
Google.Colons = NO
Google.FirstPerson = NO
Google.WordList = NO
Google.WordListCase = NO
Google.EmDash = NO
Google.HeadingPunctuation = NO

# The Atari guide is intentionally friendly and uses "we" and exclamation points.
[docs/projects/atari-user-guide*.md]
Google.Exclamation = NO
Google.We = NO
